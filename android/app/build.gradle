plugins {
    id 'com.android.application'
}

android {
    namespace 'com.eteqcam'
    compileSdk 36

    defaultConfig {
        applicationId 'com.eteqcam'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
