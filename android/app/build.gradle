plugins {
    id 'com.android.application'
}

// Release signing details live outside version control. Without them the build
// still works and simply produces an unsigned release artifact.
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('keystore.properties')
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'com.eteqcam'
    compileSdk 36

    defaultConfig {
        applicationId 'com.eteqcam'
        minSdk 29
        targetSdk 36
        versionCode 1
        versionName '1.0.0'
        // The app has no translations, so the hundred locale folders the UI
        // libraries bring with them are dead weight.
        resourceConfigurations += ['en']
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    signingConfigs {
        if (keystoreProperties.containsKey('storeFile')) {
            release {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    lint {
        abortOnError true
        // Nothing actionable: the newer libraries need an SDK platform that is
        // not installed, and upgrading is a deliberate decision, not a default.
        disable 'GradleDependency', 'AndroidGradlePluginVersion', 'OldTargetApi'
    }

    buildFeatures {
        viewBinding true
        buildConfig true
    }

    buildTypes {
        release {
            // The user interface libraries are far larger than the parts of them
            // this app actually uses.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (keystoreProperties.containsKey('storeFile')) {
                signingConfig signingConfigs.release
            }
        }
    }
}

dependencies {
    // Pinned to versions that build against the installed SDK platform (36).
    // Newer releases require compiling against 37, which is not installed here.
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.0'
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.activity:activity:1.9.3'
    // Foldables: the inner and outer screens of a Fold are different devices as
    // far as layout is concerned, and this reports which one is in use.
    implementation 'androidx.window:window:1.3.0'
}
