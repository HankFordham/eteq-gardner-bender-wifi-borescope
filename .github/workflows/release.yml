name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build-exe:
    name: windows exe
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Build exe
        run: pyinstaller eteq.spec

      - name: Checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash -Algorithm SHA256 dist/eteq.exe).Hash.ToLower()
          "$hash  eteq.exe" | Out-File -FilePath dist/eteq.exe.sha256 -Encoding ascii
          Get-Content dist/eteq.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: exe
          path: |
            dist/eteq.exe
            dist/eteq.exe.sha256
          if-no-files-found: error

  build-dist:
    name: sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install build
        run: python -m pip install --upgrade pip build

      - name: Build sdist and wheel
        run: python -m build

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: |
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error

  release:
    name: publish github release
    needs: [build-exe, build-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: exe
          path: artifacts

      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: artifacts

      - name: List artifacts
        run: ls -l artifacts

      - uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            artifacts/eteq.exe
            artifacts/eteq.exe.sha256
            artifacts/*.whl
            artifacts/*.tar.gz
